<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="school-brand">
        <div class="mascot-badge">
          <img src="https://octodex.github.com/images/Professortocat_v2.png" alt="Mergington mascot" />
        </div>
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
      </div>
      <button id="admin-toggle" class="user-btn" type="button" aria-label="Teacher login">👤</button>
    </header>

    <div id="admin-login-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content">
        <button id="close-login-modal" class="close-btn" type="button" aria-label="Close">×</button>
        <h3>Teacher Login</h3>
        <form id="admin-login-form">
          <div class="form-group">
            <label for="admin-username">Username</label>
            <input id="admin-username" type="text" required />
          </div>
          <div class="form-group">
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" required />
          </div>
          <button type="submit">Log In</button>
        </form>
      </div>
    </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="filters" class="filters">
          <div class="filter-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="">All</option>
            </select>
          </div>
          <div class="filter-group search-group">
            <label for="search-filter">Search</label>
            <input id="search-filter" type="text" placeholder="Search activities" />
          </div>
          <div class="filter-group">
            <label for="sort-filter">Sort by</label>
            <select id="sort-filter">
              <option value="">Default</option>
              <option value="name">Name</option>
              <option value="date">Date</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="admin-panel" class="admin-panel hidden">
        <h3>Teacher Dashboard</h3>
        <div id="admin-status" class="admin-status">Not signed in</div>
        <button id="admin-logout" class="secondary-btn" type="button">Log Out</button>

        <form id="admin-activity-form" class="admin-form">
          <h4>Add New Activity</h4>
          <div class="form-group">
            <label for="admin-activity-name">Activity Name</label>
            <input id="admin-activity-name" type="text" required />
          </div>
          <div class="form-group">
            <label for="admin-activity-description">Description</label>
            <textarea id="admin-activity-description" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="admin-activity-schedule">Schedule</label>
            <input id="admin-activity-schedule" type="text" required />
          </div>
          <div class="form-group">
            <label for="admin-activity-capacity">Max Participants</label>
            <input id="admin-activity-capacity" type="number" min="1" required />
          </div>
          <button type="submit">Create Activity</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
